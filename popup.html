<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Text Analyzer Settings</title>
  <style>
    body { font-family: sans-serif; width: 300px; padding: 10px; } /* Keep existing or similar */
    label { display: block; margin-top: 10px; }
    input[type='text'], input[type='password'] { width: 95%; padding: 5px; margin-top: 3px; }
    button { margin-top: 5px; /* Adjusted for potentially more buttons */ padding: 8px 12px; }
    #status, #testResult { margin-top: 10px; font-size: 0.9em; }
    /* Add styles for active/inactive nav buttons if desired later */
  </style>
</head>
<body>
  <div id="navControls" style="padding-bottom: 10px; border-bottom: 1px solid #ccc; margin-bottom: 10px;">
    <button id="showSettingsView">Settings</button>
    <button id="showModelPresetsView">Model Presets</button>
    <button id="showCustomPromptsViewButton">Custom Prompts</button>
  </div>

  <div id="settingsView">
    <h2>Settings</h2>

    <label for="apiEndpoint">API Endpoint:</label>
  <input type="text" id="apiEndpoint" placeholder="e.g., https://api.openai.com/v1/chat/completions">

  <label for="apiKey">API Key:</label>
  <input type="password" id="apiKey">

  <label>Selected Model:</label>
  <div id="selectedModelDisplay" style="padding: 5px; border: 1px solid #eee; background: #f9f9f9; min-height: 20px; margin-top: 3px;">
    No model selected
  </div>

  <div id="modelPresetSelectionControls" style="margin-top: 5px; margin-bottom: 10px;">
    <label style="margin-bottom: 3px;">Choose a Preset:</label>
    <button id="selectModelPreset1" data-preset-index="0" style="min-width: 30px; padding: 5px 0;">P1</button>
    <button id="selectModelPreset2" data-preset-index="1" style="min-width: 30px; padding: 5px 0;">P2</button>
    <button id="selectModelPreset3" data-preset-index="2" style="min-width: 30px; padding: 5px 0;">P3</button>
    <button id="selectModelPreset4" data-preset-index="3" style="min-width: 30px; padding: 5px 0;">P4</button>
    <button id="selectModelPreset5" data-preset-index="4" style="min-width: 30px; padding: 5px 0;">P5</button>
  </div>

  <div id="selectActivePromptSection" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
    <h3 style="margin-top: 0; margin-bottom: 10px; font-size: 1em;">Select Active Custom Prompt</h3>
    <div id="customPromptSelectionControls">
      <button id="selectCustomPromptButton1" data-prompt-index="0" style="min-width: 30px; padding: 5px 0;">1</button>
      <button id="selectCustomPromptButton2" data-prompt-index="1" style="min-width: 30px; padding: 5px 0;">2</button>
      <button id="selectCustomPromptButton3" data-prompt-index="2" style="min-width: 30px; padding: 5px 0;">3</button>
      <button id="selectCustomPromptButton4" data-prompt-index="3" style="min-width: 30px; padding: 5px 0;">4</button>
      <button id="selectCustomPromptButton5" data-prompt-index="4" style="min-width: 30px; padding: 5px 0;">5</button>
      <button id="selectCustomPromptButton6" data-prompt-index="5" style="min-width: 30px; padding: 5px 0;">6</button>
    </div>
    <div id="activePromptStatus" style="margin-top: 5px; font-size: 0.9em;"></div>
  </div>

  <div id="responseProcessingSection" style="margin-top: 15px; border-top: 1px solid #eee; padding-top: 10px;">
    <h3 style="margin-top: 0; margin-bottom: 10px; font-size: 1em;">Response Processing</h3>
    <div>
      <input type="checkbox" id="enableFilteringToggle" style="margin-right: 5px; vertical-align: middle;">
      <label for="enableFilteringToggle" style="display: inline; margin-top: 0;">Enable filtering of thought process</label>
    </div>
    <label for="filterStartSymbol">Start Symbol:</label>
    <input type="text" id="filterStartSymbol" placeholder="e.g., <think>">
    <label for="filterEndSymbol">End Symbol:</label>
    <input type="text" id="filterEndSymbol" placeholder="e.g., </think>">
  </div>

  <button id="save">Save Settings</button>
  <div id="status"></div>
  <button id="testApiButton" style="margin-top: 5px;">Test API Configuration</button>
  <div id="testResult" style="margin-top: 10px; font-size: 0.9em;"></div>
  </div>

  <div id="modelPresetsView" style="display: none;">
    <h2>Model Presets</h2>
    <p style="font-size: 0.9em; color: #555;">Define up to 5 model names you frequently use.</p>

    <div>
      <label for="modelPresetInput1">Preset 1:</label>
      <input type="text" id="modelPresetInput1" placeholder="e.g., gpt-4o">
    </div>
    <div>
      <label for="modelPresetInput2">Preset 2:</label>
      <input type="text" id="modelPresetInput2" placeholder="e.g., gpt-3.5-turbo">
    </div>
    <div>
      <label for="modelPresetInput3">Preset 3:</label>
      <input type="text" id="modelPresetInput3">
    </div>
    <div>
      <label for="modelPresetInput4">Preset 4:</label>
      <input type="text" id="modelPresetInput4">
    </div>
    <div>
      <label for="modelPresetInput5">Preset 5:</label>
      <input type="text" id="modelPresetInput5">
    </div>

    <button id="saveModelPresets" style="margin-top: 15px;">Save Model Presets</button>
    <div id="modelPresetsStatus" style="margin-top: 10px; font-size: 0.9em;"></div>
  </div>

  <div id="customPromptsView" style="display: none;">
    <h2>Define 6 Custom LLM Prompts</h2>
    <label for="customPromptInput1">Prompt 1:</label>
    <textarea id="customPromptInput1" rows="6" style="width: 95%; margin-top: 3px; font-family: monospace; font-size: 0.9em;"></textarea>
    <label for="customPromptInput2">Prompt 2:</label>
    <textarea id="customPromptInput2" rows="6" style="width: 95%; margin-top: 3px; font-family: monospace; font-size: 0.9em;"></textarea>
    <label for="customPromptInput3">Prompt 3:</label>
    <textarea id="customPromptInput3" rows="6" style="width: 95%; margin-top: 3px; font-family: monospace; font-size: 0.9em;"></textarea>
    <label for="customPromptInput4">Prompt 4:</label>
    <textarea id="customPromptInput4" rows="6" style="width: 95%; margin-top: 3px; font-family: monospace; font-size: 0.9em;"></textarea>
    <label for="customPromptInput5">Prompt 5:</label>
    <textarea id="customPromptInput5" rows="6" style="width: 95%; margin-top: 3px; font-family: monospace; font-size: 0.9em;"></textarea>
    <label for="customPromptInput6">Prompt 6:</label>
    <textarea id="customPromptInput6" rows="6" style="width: 95%; margin-top: 3px; font-family: monospace; font-size: 0.9em;"></textarea>
    <button id="saveCustomPromptsButton">Save Custom Prompts</button>
    <div id="customPromptsStatus" style="margin-top: 10px; font-size: 0.9em;"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
